      <text x="71" y="23" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">8 Ondas</text>
    </g>
    <g transform="translate(208 346)">
      <rect width="166" height="36" rx="18" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25" />
      <text x="83" y="23" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Autor: Felipe</text>
