<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Capa do jogo Personagens: Omi Tower Defense (POTW)">
  <defs>
    <linearGradient id="bg-potw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="0.5" stop-color="#1e1b4b" />
      <stop offset="1" stop-color="#312e81" />
    </linearGradient>
    <pattern id="grid-potw" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.06" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg-potw)" />
  <rect width="800" height="450" fill="url(#grid-potw)" />

  
  <circle cx="630" cy="140" r="56" fill="#2563eb" opacity="0.85" />
  <circle cx="715" cy="215" r="46" fill="#ea580c" opacity="0.85" />
  <circle cx="585" cy="265" r="42" fill="#16a34a" opacity="0.85" />
  <circle cx="675" cy="315" r="50" fill="#d97706" opacity="0.9" />

  
  <circle cx="650" cy="225" r="130" fill="none" stroke="#a5b4fc" stroke-width="4" stroke-dasharray="14 10" opacity="0.6" />

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
    <text x="52" y="74" fill="#93c5fd" font-size="15" font-weight="800" letter-spacing="3">PENSAMENTO LÓGICO • 9C</text>

    <text x="52" y="155" fill="#ffffff" font-size="44" font-weight="900" letter-spacing="-1">Personagens:</text>
    <text x="52" y="208" fill="#fbbf24" font-size="46" font-weight="900" letter-spacing="-1">Omi Tower Defense</text>
    <text x="52" y="255" fill="#c7d2fe" font-size="26" font-weight="800">(POTW)</text>

    <text x="52" y="305" fill="#e2e8f0" font-size="18" font-weight="500">Regras lógicas, sequências e sorteio de guardiões!</text>

    <g transform="translate(52 346)">
